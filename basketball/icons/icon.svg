    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#e6f0ff" stop-opacity=".3"/><stop offset="1" stop-color="#e6f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="320" fill="url(#glow)"/>
  <rect y="400" width="512" height="112" fill="url(#floor)"/>
  <!-- backboard -->
  <rect x="96" y="62" width="320" height="200" rx="6" fill="#bcd4f0" fill-opacity=".14" stroke="#f4f6fa" stroke-width="12"/>
  <rect x="196" y="140" width="120" height="92" fill="none" stroke="#f4f6fa" stroke-width="10"/>
  <!-- net -->
  <g stroke="#f4f4f0" stroke-width="5" fill="none" stroke-linecap="round">
