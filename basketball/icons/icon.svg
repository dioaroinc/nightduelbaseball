  <path d="M60 470 Q120 140 300 120" stroke="#ffbb4a" stroke-opacity=".75" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="2 22"/>
  <circle cx="352" cy="150" r="66" fill="url(#ball)"/>
  <g stroke="#2a1206" stroke-width="5" fill="none">
    <path d="M286 150 H418"/>
    <path d="M352 84 V216"/>
